name: Build Velocity Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Import GPG key
      if: "${{ env.GPG_KEY != '' }}"
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}
      env:
        GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    - name: Build and Sign Plugin with Maven (if GPG key present)
      if: "${{ env.GPG_KEY != '' }}"
      run: mvn clean verify -P release --batch-mode
      env:
        GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    - name: Build and Test Plugin with Maven (fallback without signing)
      if: "${{ env.GPG_KEY == '' }}"
      run: mvn clean verify --batch-mode
      env:
        GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vafps-velocity-plugin
        path: |
          target/*.jar
          target/*.asc
